# --- TPM プラグイン設定 ---
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'




# --- Catppuccin v2.0 ---
# set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_flavor 'frappe'
# set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_status_background "default"

# use theme
set -g @tokyo-night-tmux_theme night


set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"


# --- 基本操作・レスポンス設定 ---
# Escキーの遅延を無効化（Neovim推奨値の10msに設定）
set -sg escape-time 10

# prefix後の連続キー操作受付時間 (300ms)
set -g repeat-time 300

# マウス操作を有効化
set -g mouse on


# --- vim-tmux-navigator 設定 ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# tmux 3.0 以降の C-\ 対応
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"


# --- ウィンドウ・ペイン設定 ---
# ウィンドウ・ペインのインデックスを 1 から開始
set -g base-index 1
setw -g pane-base-index 1

# F1 〜 F11 で対応するウィンドウにダイレクト切り替え
bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5
bind-key -n F6 select-window -t 6
bind-key -n F7 select-window -t 7
bind-key -n F8 select-window -t 8
bind-key -n F9 select-window -t 9
bind-key -n F10 select-window -t 10
bind-key -n F11 select-window -t 11
# bind-key -n F12 select-window -t 12

# カレントパスを引き継いで分割 / 新規作成
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# --- TPM の初期化 (必ず最下部に記述) ---
run '~/.tmux/plugins/tpm/tpm'
